[package]
name = "enfoque"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["codegen"] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
chrono = "0.4.45"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
